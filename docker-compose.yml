version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: rsvp_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rsvp_tracker
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: rsvp_backend
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=rsvp_tracker
      - PORT=3001
      - JWT_SECRET=super_secret_jwt_key
    depends_on:
      - db
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: rsvp_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
    depends_on:
      - backend

volumes:
  db_data:
